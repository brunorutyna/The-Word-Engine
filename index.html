<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Ordværket — et roguelike bullet heaven, hvor du redder byen ved at bygge danske sætninger.">
<title>Ordværket</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800;900&family=Cinzel:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div id="toprow">
    <div id="hp"><div id="hpfill"></div><span id="hptext"></span></div>
    <div id="timer">5:00</div>
    <div id="lvl">Niv. 1</div>
    <div id="kills">☠ 0</div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div id="promptWrap" class="idle">
    <div class="phead"><span id="pSpeaker"></span><span id="pTag"></span></div>
    <div id="pSay"></div>
    <div class="pbody"><div id="pPic"></div><div id="pFrame"></div></div>
    <div id="pHint"></div>
  </div>
  <div id="kaede"></div>
  <div id="bossbar" class="hidden"><div id="bossname"></div><div class="bbar"><div id="bossfill"></div></div></div>
  <div id="scorePop"></div>
  <button id="actBtn" aria-label="Handling"><span>⚔</span></button>
</div>
<div id="banner"></div>
<div id="overlay"></div>
<div id="screens"></div>

<script src="js/core.js"></script>
<script src="js/content.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
